name: Build & Release

# 自动打包策略：
#  - 推送到 main（非 tag）：自动构建 + 打包 package.zip，并发布到滚动预发布版本 "latest"（无需手动上传）
#  - 推送 v* tag：自动构建 + 打包 package.zip，并创建正式 Release（含 package.zip，供思源集市自动识别版本更新）
#  - 发起 PR 到 main：仅构建校验，不发布
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: |
          cd dist
          zip -r ../package.zip .
          echo "PACKAGE_SHA256=$(sha256sum ../package.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # 推送到 main：上传构建产物，并发布/更新滚动预发布版本（latest）
      - name: Upload package artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ github.sha }}
          path: package.zip
          retention-days: 30

      - name: Update rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: Latest Build
          tag_name: latest
          prerelease: true
          make_latest: false
          body: |
            Automated build from `main` @ ${{ github.sha }}.

            package.zip SHA256: `${{ env.PACKAGE_SHA256 }}`

            > 此预发布版本由 CI 在每次推送到 main 时自动生成，请勿将其标记为稳定版本。
          files: |
            package.zip

      # 推送 v* tag：创建正式 Release 并上传 package.zip（思源集市据此识别版本更新）
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            package.zip
          fail_on_unmatched_files: true
